<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj</title>
</head>
<style>
.clock-container{
    background-color: rgba(26, 52, 54,0.75);
    margin-top: 400px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    padding: 15px;
    /* background-color: ; */
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    border: 5px solid rgba(26,52,54,0.9);
}

.clock {
    font-size: 4.5rem;
    font-weight: 600;
    color: rgba(0, 0, 0, .5);
    letter-spacing: 2px;
}

.colon {
    color: #00adb5;
    animation: blink 1s infinite;
}

#ampm {
    font-size: 1.5rem;
    color: #00adb5;
    font-weight: 700;
    text-transform: uppercase;
}

@keyframes blink {
    50% { opacity: 0.3; }
}
img{
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    z-index: -1;
}
</style>
<body>
    <img src=https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ3Rhemh0YXE2ZWw0d3VtM3d3NGtyOWoyeTFxenpncjlvMzI2dWN0MyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/12wteMTXxjLaVO/giphy.gif>
    <center>
    <div class="clock-container">
        <div class="clock">
            <span id="hours">00</span>
            <span class="colon">:</span>
            <span id="minutes">00</span>
            <span class="colon">:</span>
            <span id="seconds">00</span>
        </div>
        <div id="ampm">AM</div>
    </div>
    </center>
<script src="script.js"></script>
</body>
</html>
